name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Convex functions)
        run: npx vitest run

      # Requires no external services — Next.js build with dummy public env.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    # E2E needs a seeded Convex deployment + app server; run it, but don't
    # block merges on infrastructure flakes until it is wired to CI secrets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `npm run start`, which requires a build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Playwright smoke tests
        run: npx playwright test
        env:
          CI: "true"
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
